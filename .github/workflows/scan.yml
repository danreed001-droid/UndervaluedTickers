name: Undervalued Stock Scan

# Runs scanner.py on GitHub's servers and publishes results.html to
# docs/index.html, so it can be served with GitHub Pages -- no Python on
# your own machine needed.
#
# One-time setup after this file is added to the repo:
#   Settings -> Pages -> Source: "Deploy from a branch" -> Branch: main,
#   folder: /docs -> Save. Your report will then be live at
#   https://<your-username>.github.io/<repo-name>/
#
# To run it right now: go to the "Actions" tab -> "Undervalued Stock Scan"
# -> "Run workflow".

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "Which index to scan"
        type: choice
        options: [sp500, nasdaq, both]
        default: both
      limit:
        description: "Only scan this many random tickers (blank = no limit). Start small to test."
        type: string
        default: ""
      top:
        description: "How many top-scoring rows to keep in the report"
        type: string
        default: "150"
  schedule:
    # Weekdays 21:00 UTC (~5pm US Eastern, after the market close). Edit or
    # remove this if you only want manual runs. Scans "both" (S&P 500 +
    # Nasdaq Composite, ~3,500+ tickers) by default -- that's several
    # thousand yfinance calls and can take 30-90+ minutes; timeout-minutes
    # below is set generously to cover it, and the scanner checkpoints per
    # ticker so a run that gets rate-limited partway still produces a
    # report from whatever it fetched.
    - cron: "0 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: stock-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          # Both the manual "Run workflow" default above and this fallback
          # (used by the scheduled cron trigger, which has no inputs) scan
          # everything by default now -- pick sp500/nasdaq from the Actions
          # tab's "Run workflow" dropdown for a narrower/faster run.
          UNIVERSE: ${{ github.event.inputs.universe || 'both' }}
          LIMIT: ${{ github.event.inputs.limit }}
          TOP: ${{ github.event.inputs.top || '150' }}
        run: |
          mkdir -p docs
          ARGS="--universe $UNIVERSE --workers 16 --top $TOP -o docs/index.html"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python scanner.py $ARGS"
          python scanner.py $ARGS -v

      # yfinance calls Yahoo Finance from GitHub's shared runner IPs, which
      # occasionally get rate-limited or blocked. The scanner retries and
      # checkpoints per-ticker, so a run that hits this still produces a
      # report from whatever it managed to fetch -- it just won't be the
      # full universe. Re-run manually (Actions tab) if the results look
      # thin, or scan a smaller universe/limit.
      - name: Upload raw checkpoint + failures as a debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-debug
          path: |
            scan_checkpoint.csv
            scan_failures.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated report
        run: |
          git config user.name "stock-scanner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update scan results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push
